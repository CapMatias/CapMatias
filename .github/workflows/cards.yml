name: Cards do perfil

# Gera os cards de contribuicoes e estatisticas com o token do Daniel, para
# contar tambem os repositorios privados (so numeros, sem nome de repositorio).
# O segredo SUMMARY_GITHUB_TOKEN fica em Settings > Secrets and variables > Actions.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          TIME_ZONE: "America/Sao_Paulo"
          THEME: "github_dark"
          AUTO_PUSH: true
